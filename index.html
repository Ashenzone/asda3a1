<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#B08D57">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>JR IMPORTADOS — Painel Administrativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --cream:#FBF9F4;
    --cream-2:#F5F0E6;
    --gold:#B08D57;
    --gold-dark:#8A6D3F;
    --gold-deep:#6E5730;
    --gold-light:#EFE6D2;
    --gold-wash:#FAF6EC;
    --ink:#272220;
    --ink-soft:#8A8078;
    --border:#ECE3D0;
    --danger:#A6453A;
    --danger-wash:#F7EAE8;
    --shadow-sm: 0 1px 3px rgba(110,87,48,0.08);
    --shadow-md: 0 8px 24px rgba(110,87,48,0.10);
    --shadow-lg: 0 20px 48px rgba(39,34,32,0.14);
    --radius: 18px;
    --radius-sm: 12px;
    --sidebar-w: 264px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--white);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:600;
    letter-spacing:.2px;
  }
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--gold-light);}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  /* ---------- Layout shell ---------- */
  #app{display:flex; min-height:100vh;}

  .sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--white);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:32px 22px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    display:flex; align-items:center; gap:12px;
    padding:0 6px 30px 6px;
    border-bottom:1px solid var(--border);
    margin-bottom:22px;
  }
  .brand-mark{
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(135deg,var(--gold),var(--gold-deep));
    display:flex;align-items:center;justify-content:center;
    color:var(--white); font-family:'Cormorant Garamond',serif; font-weight:600; font-size:19px;
    box-shadow:var(--shadow-sm);
    flex-shrink:0;
  }
  .brand-text .t1{font-size:20px; line-height:1.1; font-family:'Cormorant Garamond',serif; font-weight:600;}
  .brand-text .t2{font-size:11.5px; color:var(--ink-soft); letter-spacing:.4px;}

  .nav{display:flex; flex-direction:column; gap:4px;}
  .nav-item{
    display:flex; align-items:center; gap:13px;
    padding:12px 14px;
    border-radius:12px;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:14.5px;
    font-weight:500;
    border:1px solid transparent;
    transition:background .15s ease, color .15s ease;
    user-select:none;
  }
  .nav-item svg{flex-shrink:0;}
  .nav-item:hover{background:var(--gold-wash); color:var(--ink);}
  .nav-item.active{
    background:var(--gold-wash);
    color:var(--gold-deep);
    border-color:var(--gold-light);
    font-weight:600;
  }
  .nav-sep{height:1px; background:var(--border); margin:14px 4px;}

  .sidebar-foot{
    margin-top:auto;
    padding-top:16px;
    font-size:11.5px;
    color:var(--ink-soft);
    border-top:1px solid var(--border);
  }

  .main{flex:1; min-width:0; padding:40px 48px 100px 48px;}
  .view-header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:28px; flex-wrap:wrap;}
  .view-header h1{font-size:32px; margin:0 0 6px 0; color:var(--ink);}
  .view-header p{margin:0; color:var(--ink-soft); font-size:14.5px;}
  .eyebrow-link{display:flex; align-items:center; gap:6px; color:var(--gold-deep); font-size:13px; font-weight:600; cursor:pointer; margin-bottom:10px;}
  .eyebrow-link:hover{text-decoration:underline;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:12px 20px;
    border-radius:11px;
    font-size:14px; font-weight:600;
    cursor:pointer;
    border:1px solid transparent;
    transition:transform .08s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--gold); color:var(--white); box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:var(--gold-dark);}
  .btn-secondary{background:var(--white); color:var(--gold-deep); border-color:var(--gold-light);}
  .btn-secondary:hover{background:var(--gold-wash); border-color:var(--gold);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border-color:transparent; padding:10px 14px;}
  .btn-ghost:hover{color:var(--ink); background:var(--cream);}
  .btn-danger{background:var(--white); color:var(--danger); border-color:#E7CFCB;}
  .btn-danger:hover{background:var(--danger-wash);}
  .btn-danger-solid{background:var(--danger); color:var(--white);}
  .btn-danger-solid:hover{background:#8f3a30;}
  .btn-block{width:100%;}
  .btn-sm{padding:9px 14px; font-size:13px; border-radius:9px;}
  .icon-btn{
    width:36px;height:36px; border-radius:9px; border:1px solid var(--border); background:var(--white);
    display:flex;align-items:center;justify-content:center; color:var(--ink-soft); cursor:pointer; flex-shrink:0;
  }
  .icon-btn:hover{border-color:var(--gold); color:var(--gold-deep); background:var(--gold-wash);}

  /* ---------- Stat cards / grids ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:36px;}
  .stat-card{
    background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px 22px; box-shadow:var(--shadow-sm);
  }
  .stat-card .num{font-family:'Cormorant Garamond',serif; font-size:38px; font-weight:600; color:var(--ink); line-height:1;}
  .stat-card .lbl{margin-top:8px; font-size:13px; color:var(--ink-soft);}
  .stat-card .icon{width:34px;height:34px;border-radius:9px;background:var(--gold-wash);display:flex;align-items:center;justify-content:center;color:var(--gold-deep); margin-bottom:14px;}

  .section-title{font-size:19px; margin:0 0 16px 0; color:var(--ink);}

  .cards-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:18px;}

  .cat-card{
    background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; cursor:pointer; box-shadow:var(--shadow-sm);
    transition:box-shadow .15s ease, border-color .15s ease, transform .1s ease;
    display:flex; flex-direction:column; gap:14px;
  }
  .cat-card:hover{box-shadow:var(--shadow-md); border-color:var(--gold-light); transform:translateY(-2px);}
  .cat-card .cat-icon{width:44px;height:44px;border-radius:12px;background:var(--gold-wash);display:flex;align-items:center;justify-content:center;color:var(--gold-deep);}
  .cat-card .cat-name{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:20px;}
  .cat-card .cat-count{font-size:12.5px; color:var(--ink-soft);}
  .cat-card.add{
    align-items:center; justify-content:center; text-align:center; border-style:dashed;
    color:var(--ink-soft); min-height:132px;
  }
  .cat-card.add:hover{color:var(--gold-deep);}

  .badge{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11px; font-weight:600; padding:4px 9px; border-radius:100px;
    background:var(--gold-wash); color:var(--gold-deep); border:1px solid var(--gold-light);
  }

  /* ---------- Item / delivery cards ---------- */
  .item-card{
    background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; box-shadow:var(--shadow-sm); display:flex; flex-direction:column;
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .item-card:hover{box-shadow:var(--shadow-md); border-color:var(--gold-light);}
  .item-thumb{
    width:100%; aspect-ratio:4/3; background:var(--cream); display:flex;align-items:center;justify-content:center;
    color:var(--gold-light); overflow:hidden;
  }
  .item-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .item-body{padding:16px 16px 18px 16px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .item-body .name{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:19px; margin:0;}
  .item-body .desc{font-size:13px; color:var(--ink-soft); line-height:1.5; margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .item-body .value{font-size:16px; font-weight:700; color:var(--gold-deep); font-family:'Cormorant Garamond',serif; font-size:21px;}
  .item-actions{display:flex; gap:8px; margin-top:auto; padding-top:6px;}
  .item-actions .btn{flex:1;}
  .item-expand-btn svg{transition:transform .15s ease;}
  .item-expand-btn.open svg{transform:rotate(90deg);}
  .client-panel{
    margin-top:10px; padding:14px; border-radius:12px; background:var(--gold-wash);
    border:1px solid var(--gold-light); display:flex; flex-direction:column; gap:10px;
  }
  .client-toggle{display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:600; color:var(--ink); cursor:pointer;}
  .client-toggle input{width:17px; height:17px; accent-color:var(--gold-deep); cursor:pointer;}
  .client-image-choice{display:flex; flex-direction:column; gap:8px; padding-left:2px;}
  .radio-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); cursor:pointer;}
  .radio-row input{width:15px; height:15px; accent-color:var(--gold-deep); cursor:pointer;}
  .client-image-upload{margin-top:2px;}
  .client-image-upload .image-drop{
    width:100%; height:110px; border-radius:10px; border:1.5px dashed var(--gold-light);
    background:var(--white); display:flex; align-items:center; justify-content:center;
    overflow:hidden; cursor:pointer; color:var(--ink-soft); font-size:12.5px; position:relative;
  }
  .client-image-upload .image-drop img{width:100%; height:100%; object-fit:cover;}
  .client-image-upload input[type="file"]{display:none;}
  .client-badge{background:var(--gold-deep); color:var(--white);}
  .client-tags{border-top:1px dashed var(--gold-light); margin-top:4px; padding-top:10px; display:flex; flex-direction:column; gap:7px;}
  .client-tags-label{font-size:11.5px; color:var(--ink-soft); margin:0 0 2px; text-transform:uppercase; letter-spacing:.5px;}
  .tag-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink); cursor:pointer;}
  .tag-row input{width:15px; height:15px; accent-color:var(--gold-deep); cursor:pointer;}

  .delivery-card{
    background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow-sm); display:flex; gap:16px;
  }
  .delivery-card .d-thumb{
    width:96px; height:96px; border-radius:12px; background:var(--cream); flex-shrink:0; overflow:hidden;
    display:flex;align-items:center;justify-content:center; color:var(--gold-light);
  }
  .delivery-card .d-thumb img{width:100%;height:100%;object-fit:cover;}
  .delivery-card .d-info{flex:1; min-width:0;}
  .delivery-card .d-name{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:19px; margin:0 0 2px 0;}
  .delivery-card .d-value{color:var(--gold-deep); font-weight:700; font-size:14px; margin-bottom:8px;}
  .d-meta{display:flex; flex-wrap:wrap; gap:14px; margin:10px 0 12px 0;}
  .d-meta-item{display:flex; align-items:flex-start; gap:8px; font-size:13px; color:var(--ink); min-width:150px;}
  .d-meta-item svg{color:var(--gold-deep); margin-top:1px; flex-shrink:0;}
  .d-meta-item .lbl2{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:1px;}

  /* ---------- Forms ---------- */
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:7px;}
  .field .hint{font-size:11.5px; color:var(--ink-soft); margin-top:5px;}
  input[type="text"], input[type="number"], input[type="date"], textarea, select{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--white); font-size:14.5px; font-family:inherit; color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  textarea{resize:vertical; min-height:80px; line-height:1.5;}
  input:focus, textarea:focus, select:focus{
    outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-wash);
  }
  .value-input-wrap{position:relative;}
  .value-input-wrap .prefix{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:14.5px; pointer-events:none;}
  .value-input-wrap input{padding-left:38px;}

  .image-drop{
    border:1.5px dashed var(--border); border-radius:14px; background:var(--cream);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    padding:26px 16px; cursor:pointer; text-align:center; color:var(--ink-soft); position:relative; overflow:hidden;
    min-height:150px;
  }
  .image-drop:hover{border-color:var(--gold); background:var(--gold-wash); color:var(--gold-deep);}
  .image-drop .preview{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .image-drop .preview-overlay{
    position:absolute; inset:0; background:rgba(39,34,32,0.45); color:var(--white);
    display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s ease; font-size:13px; font-weight:600; gap:6px;
  }
  .image-drop:hover .preview-overlay{opacity:1;}
  .image-drop input[type="file"]{display:none;}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(39,34,32,0.42); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .modal{
    background:var(--white); border-radius:22px; width:100%; max-width:480px;
    max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg);
    animation:slideUp .18s ease;
  }
  @keyframes slideUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:24px 26px 6px 26px;}
  .modal-head h2{font-size:23px; margin:0;}
  .modal-body{padding:18px 26px 26px 26px;}
  .modal-foot{display:flex; gap:10px; padding:0 26px 26px 26px;}
  .modal-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--cream);color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .modal-close:hover{background:var(--gold-light); color:var(--gold-deep);}
  .modal-sub{color:var(--ink-soft); font-size:13px; margin:0 0 6px 0; padding:0 26px;}

  .confirm-icon{width:52px;height:52px;border-radius:50%;background:var(--danger-wash); color:var(--danger); display:flex;align-items:center;justify-content:center; margin:0 auto 16px auto;}

  /* ---------- Empty state ---------- */
  .empty{
    border:1px dashed var(--border); border-radius:var(--radius); background:var(--cream);
    padding:56px 24px; text-align:center; color:var(--ink-soft);
  }
  .empty .e-icon{width:52px;height:52px;border-radius:50%;background:var(--white); border:1px solid var(--border); display:flex;align-items:center;justify-content:center;margin:0 auto 16px auto; color:var(--gold);}
  .empty h3{margin:0 0 6px 0; color:var(--ink); font-size:20px;}
  .empty p{margin:0 0 18px 0; font-size:13.5px;}

  /* ---------- Toast ---------- */
  #toast-root{position:fixed; bottom:26px; right:26px; z-index:1400; display:flex; flex-direction:column; gap:10px;}
  .toast{
    background:var(--ink); color:var(--white); padding:13px 18px; border-radius:11px; font-size:13.5px;
    box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; animation:toastIn .2s ease;
  }
  .toast svg{color:var(--gold); flex-shrink:0;}
  @keyframes toastIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Category manage rows (settings) ---------- */
  .manage-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 18px; border:1px solid var(--border); border-radius:14px; background:var(--white);
    margin-bottom:10px;
  }
  .manage-row .mr-name{font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:8px;}
  .manage-row .mr-actions{display:flex; gap:8px; flex-shrink:0;}
  .rename-input{display:flex; gap:8px; align-items:center; flex:1;}

  .settings-card{background:var(--white); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:22px; box-shadow:var(--shadow-sm);}
  .settings-card h3{margin:0 0 4px 0; font-size:19px;}
  .settings-card .desc{color:var(--ink-soft); font-size:13px; margin:0 0 18px 0;}

  /* ---------- Portão de segurança (gate) ---------- */
  #gate-root{position:fixed; inset:0; z-index:3000; background:var(--white);}
  .gate-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background: radial-gradient(circle at 50% 0%, var(--gold-wash) 0%, var(--white) 55%);
  }
  .gate-card{
    width:100%; max-width:460px; background:var(--white); border:1px solid var(--border);
    border-radius:24px; box-shadow:var(--shadow-lg); padding:38px 34px; text-align:center;
  }
  .gate-mark{
    width:56px;height:56px;border-radius:50%; margin:0 auto 18px auto;
    background:linear-gradient(135deg,var(--gold),var(--gold-deep));
    display:flex;align-items:center;justify-content:center; color:var(--white);
    font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:600; box-shadow:var(--shadow-sm);
  }
  .gate-card h1{font-size:26px; margin:0 0 8px 0;}
  .gate-card .gate-sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 26px 0; line-height:1.6;}
  .gate-progress{display:flex; gap:6px; justify-content:center; margin-bottom:22px;}
  .gate-dot{width:26px; height:4px; border-radius:100px; background:var(--border);}
  .gate-dot.done{background:var(--gold);}
  .gate-question{font-size:15px; font-weight:600; margin-bottom:12px; text-align:left; line-height:1.5;}
  .gate-card textarea, .gate-card input[type="email"], .gate-card input[type="text"], .gate-card input[type="password"]{
    width:100%; padding:13px 15px; border-radius:11px; border:1px solid var(--border);
    font-size:14.5px; font-family:inherit; text-align:left;
  }
  .gate-card textarea:focus, .gate-card input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-wash);}
  .gate-error{color:var(--danger); font-size:12.5px; margin-top:8px; text-align:left; min-height:16px;}

  .gate-alert{
    position:fixed; inset:0; z-index:3100; background:#241612;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
    animation:fadeIn .15s ease;
  }
  .gate-alert .a-icon{color:#E4B39A; margin-bottom:18px;}
  .gate-alert h1{color:var(--white); font-size:30px; margin:0 0 10px 0;}
  .gate-alert p{color:#E9D8D0; font-size:14px; margin:0;}
  .gate-alert .countdown{margin-top:22px; font-size:13px; color:#C79E8F; font-weight:600;}

  .gate-blocked{
    position:fixed; inset:0; z-index:3100; background:var(--ink);
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
  }
  .gate-blocked .b-icon{color:var(--gold); margin-bottom:18px;}
  .gate-blocked h1{color:var(--white); font-size:26px; margin:0 0 10px 0;}
  .gate-blocked p{color:#C9C0B6; font-size:13.5px; margin:0; max-width:360px;}

  .sec-list-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px; font-size:13.5px;}

  /* ---------- Temas ---------- */
  :root[data-theme="clara"]{
    --gold:#83888F; --gold-dark:#666B72; --gold-deep:#4E5359;
    --gold-light:#E7E9EC; --gold-wash:#F4F5F6;
  }
  :root[data-theme="escura"]{
    --white:#1C1815; --cream:#242019; --cream-2:#2A251E;
    --gold:#D4AF6A; --gold-dark:#C79A4E; --gold-deep:#EAC98A;
    --gold-light:#4A3F2E; --gold-wash:#2E2717;
    --ink:#F3EDE3; --ink-soft:#B3A996;
    --border:#3A3229; --danger:#E58C7D; --danger-wash:#3A2420;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.35);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
    --shadow-lg: 0 20px 48px rgba(0,0,0,0.55);
  }

  /* ---------- Filtros de vendas (chips) ---------- */
  .filter-bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:4px 0 22px 0;}
  .chip{
    padding:9px 16px; border-radius:100px; border:1px solid var(--border); background:var(--white);

    padding:9px 12px; border-radius:100px; border:1px solid var(--border); font-size:13px; background:var(--white); color:var(--ink);

  /* ---------- Seletor de aparência ---------- */
  .theme-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:12px;}
  .theme-opt{
    border:1.5px solid var(--border); border-radius:14px; padding:14px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:9px; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    background:var(--white);
  }
  .theme-opt:hover{border-color:var(--gold);}
  .theme-opt.active{border-color:var(--gold); background:var(--gold-wash); color:var(--gold-deep);}
  .theme-swatch{width:100%; height:44px; border-radius:10px; border:1px solid var(--border);}

  /* ---------- Gráfico de faturamento (Vendas Entregues) ---------- */
  .chart-card{
    background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; margin-bottom:22px; box-shadow:var(--shadow-sm);
  }
  .chart-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
  .chart-title{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:19px;}
  .chart-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .chart-grid-line{stroke:var(--border); stroke-width:1;}
  .chart-grid-label{fill:var(--ink-soft); font-size:10px;}
  .chart-line{fill:none; stroke:var(--gold-deep); stroke-width:2.4; stroke-linejoin:round; stroke-linecap:round;}
  .chart-dot{fill:var(--gold); stroke:var(--white); stroke-width:1.5;}
  .chart-dot.best{fill:var(--danger);}
  .chart-xlabel{fill:var(--ink-soft); font-size:10.5px; text-anchor:middle;}
  .chart-best-label{fill:var(--danger); font-size:11px; font-weight:700; text-anchor:middle;}
  .chart-grad-a{stop-color:var(--gold); stop-opacity:0.30;}
  .chart-grad-b{stop-color:var(--gold); stop-opacity:0;}
  .chart-empty{padding:30px; text-align:center; color:var(--ink-soft); font-size:13.5px;}

  /* ---------- Mobile top bar / bottom nav ---------- */
  .mobile-topbar{display:none;}
  .bottom-nav{display:none;}

/* =========================================================
   ESTADO E PERSISTÊNCIA

const DEFAULT_CATEGORY_ID = 'cat-vendas-entregar';
let categories = [];
let items = [];
let currentView = 'inicio';       // inicio | categorias | categoria | entregas | vendas-entregues | historico | configuracoes
let currentCategoryId = null;
let toastTimer = null;
let salesFilterMode = 'tudo';     // hoje | semana | mes | ano | tudo
let salesFilterDay = null;        // 'YYYY-MM-DD' ou null
let appSettings = { theme: 'padrao', customColor: '#B08D57', storeMode: 'animado' };
let expandedItemId = null; // peça com o painel "mostrar para o cliente" aberto

function uid(prefix){ return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

const API_BASE = '';
let adminToken = localStorage.getItem('adminToken') || '';

async function api(path, options = {}){
  const headers = { 'Content-Type':'application/json', ...(options.headers || {}) };
  if(adminToken) headers['Authorization'] = 'Bearer ' + adminToken;
  const r = await fetch(API_BASE + path, { ...options, headers });
  if(r.status === 401){
    adminToken = '';
    localStorage.removeItem('adminToken');
    const err = new Error('Sessão expirada, faça login novamente.');
    err.unauthorized = true;
    throw err;
  }
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || `Erro ${r.status}`);
  return data;
}

async function loadData(){
  try{
    const data = await api('/api/state');
    categories = Array.isArray(data.categories) ? data.categories : [];
    items = Array.isArray(data.items) ? data.items : [];
    if(!categories.length){
      categories = [{ id: DEFAULT_CATEGORY_ID, name: 'Vendas para Entregar', createdAt: Date.now() }];
      await saveCategories();
    }
  }catch(e){
    if(e.unauthorized) throw e;
    console.error('Falha ao carregar dados do servidor', e);
    categories = [{ id: DEFAULT_CATEGORY_ID, name: 'Vendas para Entregar', createdAt: Date.now() }];
    items = [];
    toast('Não foi possível conectar ao servidor', ICONS.alertTriangle);
  }
}

async function saveState(){
  try{
    await api('/api/state', { method:'PUT', body: JSON.stringify({ categories, items }) });
  }catch(e){
    if(e.unauthorized){ toast('Sua sessão expirou. Faça login novamente.', ICONS.alertTriangle); logoutAdmin(); throw e; }
    console.error('Falha ao salvar dados', e);
    toast('Falha ao salvar no banco', ICONS.alertTriangle);
    throw e;
  }
}
async function saveCategories(){ return saveState(); }
async function saveItems(){ return saveState(); }

/* ---------- Aparência (tema) ---------- */
async function loadSettings(){
  try{
    const data = await api('/api/settings');
    appSettings = { theme: data.theme || 'padrao', customColor: data.customColor || '#B08D57', storeMode: data.storeMode || 'animado' };
  }catch(e){
    appSettings = { theme: 'padrao', customColor: '#B08D57', storeMode: 'animado' };
  }
  applyTheme();
}
async function saveSettings(){
  try{ await api('/api/settings', { method:'PUT', body: JSON.stringify(appSettings) }); }
  catch(e){ console.error('Falha ao salvar aparência', e); }
}
function hexToRgb(hex){
  hex = String(hex||'#B08D57').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16) || 0;
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function mixHex(hex, target, amount){
  const a = hexToRgb(hex), b = hexToRgb(target);
  return rgbToHex(a.r+(b.r-a.r)*amount, a.g+(b.g-a.g)*amount, a.b+(b.b-a.b)*amount);
}
function applyCustomColor(hex){
  const s = document.documentElement.style;
  s.setProperty('--gold', hex);
  s.setProperty('--gold-dark', mixHex(hex, '#000000', 0.18));
  s.setProperty('--gold-deep', mixHex(hex, '#000000', 0.34));
  s.setProperty('--gold-light', mixHex(hex, '#FFFFFF', 0.72));
  s.setProperty('--gold-wash', mixHex(hex, '#FFFFFF', 0.90));
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', appSettings.theme || 'padrao');
  const s = document.documentElement.style;
  ['--gold','--gold-dark','--gold-deep','--gold-light','--gold-wash'].forEach(v=>s.removeProperty(v));
  if(appSettings.theme === 'personalizada') applyCustomColor(appSettings.customColor || '#B08D57');
}

/* =========================================================
   HELPERS
   ========================================================= */
function fmtMoney(v){
  const n = Number(v)||0;
  return n.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function categoryById(id){ return categories.find(c => c.id === id); }
function itemsInCategory(catId){ return items.filter(it => it.categoryId === catId && it.status === 'in_category'); }
function pendingDeliveries(){ return items.filter(it => it.status === 'to_deliver').sort((a,b)=> (b.delivery?.forwardedAt||0) - (a.delivery?.forwardedAt||0)); }
function finishedDeliveries(){ return items.filter(it => it.status === 'delivered'); }

function dateStrFromTs(ts){
  const d = new Date(ts || Date.now());
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getFilteredSales(){
  const list = finishedDeliveries();
  if(salesFilterDay) return list.filter(it => dateStrFromTs(it.finishedAt || it.delivery?.forwardedAt) === salesFilterDay);
  const now = Date.now(), DAY = 86400000;
  if(salesFilterMode === 'hoje') return list.filter(it => dateStrFromTs(it.finishedAt || it.delivery?.forwardedAt) === dateStrFromTs(now));
  if(salesFilterMode === 'semana') return list.filter(it => now - (it.finishedAt || it.delivery?.forwardedAt || 0) <= 7*DAY);
  if(salesFilterMode === 'mes') return list.filter(it => now - (it.finishedAt || it.delivery?.forwardedAt || 0) <= 30*DAY);
  if(salesFilterMode === 'ano') return list.filter(it => now - (it.finishedAt || it.delivery?.forwardedAt || 0) <= 365*DAY);
  return list;
}

function fmtDateShort(dateStr){
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}`;
}
function fmtDateFull(dateStr){
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}
function fmtMoneyShort(v){
  if(v >= 1000) return 'R$ ' + (v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + 'k';
  return v.toLocaleString('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });
}

function buildDailyRevenueSeries(salesList){
  const map = new Map();
  salesList.forEach(it=>{
    const day = dateStrFromTs(it.finishedAt || it.delivery?.forwardedAt);
    const revenue = (Number(it.value)||0) * (it.quantity ?? 1);
    map.set(day, (map.get(day)||0) + revenue);
  });
  return Array.from(map.entries())
    .map(([date,total])=>({date,total}))
    .sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
}

function renderSalesLineChart(salesList){
  const series = buildDailyRevenueSeries(salesList);
  if(series.length === 0){
    return `<div class="chart-card"><div class="chart-head"><div class="chart-title">Faturamento por dia</div></div><div class="chart-empty">Sem vendas suficientes para desenhar o gráfico ainda.</div></div>`;
  }
  const W = 760, H = 260, padL = 58, padR = 20, padT = 24, padB = 34;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const maxVal = Math.max(...series.map(p=>p.total), 1);
  const n = series.length;
  const stepX = n > 1 ? innerW / (n-1) : 0;
  const points = series.map((p,i)=>{
    const x = padL + (n>1 ? i*stepX : innerW/2);
    const y = padT + innerH - (p.total/maxVal)*innerH;
    return { x, y, date:p.date, total:p.total };
  });
  const bestIdx = points.reduce((best,p,i)=> p.total > points[best].total ? i : best, 0);
  const linePath = points.map((p,i)=> `${i===0?'M':'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  const areaPath = n > 1
    ? `${linePath} L ${points[n-1].x.toFixed(1)} ${(padT+innerH).toFixed(1)} L ${points[0].x.toFixed(1)} ${(padT+innerH).toFixed(1)} Z`
    : '';

  const gridFracs = [0, 0.5, 1];
  const gridLines = gridFracs.map(f=>{
    const y = padT + innerH*(1-f);
    return `
      <line class="chart-grid-line" x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}"/>
      <text class="chart-grid-label" x="${padL-8}" y="${(y+3).toFixed(1)}" text-anchor="end">${fmtMoneyShort(maxVal*f)}</text>
    `;
  }).join('');

  const labelEvery = Math.max(1, Math.ceil(n/7));
  const xLabels = points.map((p,i)=> (i % labelEvery === 0 || i === n-1)
    ? `<text class="chart-xlabel" x="${p.x.toFixed(1)}" y="${H-10}">${fmtDateShort(p.date)}</text>` : ''
  ).join('');

  const dots = points.map((p,i)=> `<circle class="chart-dot ${i===bestIdx?'best':''}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${i===bestIdx?5.5:3.2}"/>`).join('');

  const bestLabel = `<text class="chart-best-label" x="${points[bestIdx].x.toFixed(1)}" y="${(points[bestIdx].y-12).toFixed(1)}">${fmtMoney(points[bestIdx].total)}</text>`;

  return `
  <div class="chart-card">
    <div class="chart-head">
      <div>
        <div class="chart-title">Faturamento por dia</div>
        <div class="chart-sub">Melhor dia no período: <strong>${fmtDateFull(points[bestIdx].date)}</strong> · ${fmtMoney(points[bestIdx].total)}</div>
      </div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block; overflow:visible;">
      <defs>
        <linearGradient id="salesAreaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop class="chart-grad-a" offset="0%"/>
          <stop class="chart-grad-b" offset="100%"/>
        </linearGradient>
      </defs>
      ${gridLines}
      ${areaPath ? `<path class="chart-area" d="${areaPath}" fill="url(#salesAreaGrad)" stroke="none"/>` : ''}
      <path class="chart-line" d="${linePath}"/>
      ${dots}
      ${bestLabel}
      ${xLabels}
    </svg>
  </div>`;
}

function toast(msg, icon){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${icon || ICONS.check}<span>${escapeHtml(msg)}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s ease, transform .25s ease'; el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(), 250); }, 2600);
}

/* Redimensiona a imagem antes de salvar, para manter o armazenamento leve */
function processImageFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function render(){

  else if(currentView === 'categorias') root.innerHTML = renderCategorias();

}

  try{

    el.innerHTML = list.map(h=>`

/* =========================================================
   MODAIS
   ========================================================= */
function openModal(html){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" id="modal-backdrop"><div class="modal">${html}</div></div>`;
  root.querySelector('#modal-backdrop').addEventListener('mousedown', (e)=>{
    if(e.target.id === 'modal-backdrop') closeModal();
  });
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

/* ---- Modal: Nova / Renomear categoria ---- */
function modalCategoryForm(existing){
  openModal(`
    <div class="modal-head"><h2>${existing ? 'Renomear categoria' : 'Nova categoria'}</h2>
      <button class="modal-close" data-action="close-modal">${ICONS.x}</button></div>
    <div class="modal-body">
      <div class="field">
        <label>Nome da categoria</label>
        <input type="text" id="f-cat-name" placeholder="Ex: Reservados, Encomendas..." value="${existing ? escapeHtml(existing.name) : ''}" maxlength="40">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-action="close-modal">Cancelar</button>
      <button class="btn btn-primary btn-block" data-action="save-category" data-id="${existing ? existing.id : ''}">${ICONS.check} Salvar</button>
    </div>
  `);
  setTimeout(()=> document.getElementById('f-cat-name')?.focus(), 50);
}

/* ---- Modal: Adicionar / Editar peça ---- */
let pendingImageData = null;
function modalItemForm(catId, existing){
  pendingImageData = existing?.image || null;
  openModal(`
    <div class="modal-head"><h2>${existing ? 'Editar peça' : 'Adicionar peça'}</h2>
      <button class="modal-close" data-action="close-modal">${ICONS.x}</button></div>
    <div class="modal-body">
      <div class="field">
        <label>Imagem da peça</label>
        <label class="image-drop" id="image-drop">
          ${existing?.image ? `<img class="preview" id="img-preview" src="${existing.image}"><div class="preview-overlay">${ICONS.camera} Trocar imagem</div>` : `<div id="img-placeholder">${ICONS.image}<div style="margin-top:6px; font-size:13px;">Toque para escolher uma foto</div><div style="font-size:11.5px; margin-top:2px;">Galeria ou câmera do dispositivo</div></div>`}
          <input type="file" id="f-item-image" accept="image/*">
        </label>
      </div>
      <div class="field">
        <label>Nome da peça</label>
        <input type="text" id="f-item-name" placeholder="Ex: Vestido midi floral" value="${existing ? escapeHtml(existing.name) : ''}" maxlength="60">
      </div>
      <div class="field">
        <label>Descrição</label>
        <textarea id="f-item-desc" placeholder="Detalhes, tamanho, tecido, estado da peça...">${existing ? escapeHtml(existing.description) : ''}</textarea>
      </div>
      <div style="display:flex; gap:14px;">
        <div class="field" style="flex:1;">
          <label>Valor</label>
          <div class="value-input-wrap">
            <span class="prefix">R$</span>
            <input type="number" id="f-item-value" min="0" step="0.01" placeholder="0,00" value="${existing ? existing.value : ''}">
          </div>
        </div>
        <div class="field" style="width:110px;">
          <label>Quantidade</label>
          <input type="number" id="f-item-qty" min="1" step="1" value="${existing ? (existing.quantity ?? 1) : 1}">
        </div>
      </div>
    </div>
    <div class="modal-foot" style="flex-direction:column;">
      <button class="btn btn-primary btn-block" data-action="save-item" data-cat="${catId}" data-id="${existing ? existing.id : ''}">${ICONS.check} ${existing ? 'Salvar alterações' : 'Salvar peça'}</button>
      ${existing ? `<button class="btn btn-secondary btn-block" data-action="forward-item" data-id="${existing.id}">${ICONS.truck} Encaminhar para entrega</button>` : ''}
    </div>
  `);
  document.getElementById('f-item-image').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const dataUrl = await processImageFile(file);
    pendingImageData = dataUrl;
    const drop = document.getElementById('image-drop');
    drop.innerHTML = `<img class="preview" id="img-preview" src="${dataUrl}"><div class="preview-overlay">${ICONS.camera} Trocar imagem</div><input type="file" id="f-item-image" accept="image/*">`;
    document.getElementById('f-item-image').addEventListener('change', arguments.callee);
  });
}

/* ---- Modal: Encaminhar para entrega ---- */

/* ---- Modal genérico de confirmação ---- */
function modalConfirm({title, message, confirmLabel, onConfirmAction, danger}){
  openModal(`
    <div class="modal-body" style="padding-top:30px; text-align:center;">
      <div class="confirm-icon">${ICONS.alertTriangle}</div>

      <p style="color:var(--ink-soft); font-size:14px; margin:0;">${message}</p>

/* =========================================================
   AÇÕES (event delegation)
   ========================================================= */
let confirmContext = null;

function attachViewHandlers(){
  document.querySelectorAll('[data-open-category]').forEach(el=>{
    el.addEventListener('click', ()=> openCategory(el.dataset.openCategory));
  });
  if(currentView === 'configuracoes'){
    const colorInput = document.getElementById('custom-color-input');
    if(colorInput){
      colorInput.addEventListener('input', (e)=> applyCustomColor(e.target.value));
      colorInput.addEventListener('change', async (e)=>{ appSettings.customColor = e.target.value; await saveSettings(); });
    }
  }
  if(currentView === 'historico') loadHistory();
  if(currentView === 'vendas-entregues'){
    document.getElementById('sales-day-input')?.addEventListener('change', (e)=>{
      salesFilterDay = e.target.value || null;
      render();
    });
  }
}

document.addEventListener('click', async (e)=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  if(action === 'install-app') installApp();

  if(action === 'close-modal') closeModal();

  else if(action === 'go-categorias') setView('categorias');

  else if(action === 'new-category') modalCategoryForm(null);

  else if(action === 'rename-category') modalCategoryForm(categoryById(t.dataset.id));

  else if(action === 'save-category'){
    const name = document.getElementById('f-cat-name').value.trim();
    if(!name){ toast('Digite um nome para a categoria', ICONS.alertTriangle); return; }
    const id = t.dataset.id;
    if(id){
      const cat = categoryById(id); cat.name = name;
      toast('Categoria atualizada');
    } else {
      categories.push({ id: uid('cat'), name, createdAt: Date.now() });
      toast('Categoria criada');
    }
    await saveCategories();
    closeModal(); render();
  }

  else if(action === 'delete-category'){
    const cat = categoryById(t.dataset.id);
    const count = itemsInCategory(cat.id).length;
    confirmContext = { type:'delete-category', id: cat.id };
    modalConfirm({
      title:'Excluir categoria?',
      message: count>0 ? `"${escapeHtml(cat.name)}" possui ${count} peça(s). Ao excluir, essas peças também serão removidas.` : `Deseja realmente excluir "${escapeHtml(cat.name)}"?`,
      confirmLabel:'Excluir categoria',
      onConfirmAction:'do-delete-category',
      danger:true
    });
  }
  else if(action === 'do-delete-category'){
    const { id } = confirmContext;
    categories = categories.filter(c=>c.id!==id);
    items = items.filter(it=>!(it.categoryId===id && it.status==='in_category'));
    await saveCategories(); await saveItems();
    toast('Categoria excluída');
    closeModal();
    if(currentView==='categoria' && currentCategoryId===id) setView('categorias'); else render();
  }

  else if(action === 'new-item') modalItemForm(t.dataset.cat, null);

  else if(action === 'edit-item') modalItemForm(null, items.find(i=>i.id===t.dataset.id));

  else if(action === 'toggle-item-expand'){
    expandedItemId = expandedItemId === t.dataset.id ? null : t.dataset.id;
    render();
  }

  else if(action === 'save-item'){
    const name = document.getElementById('f-item-name').value.trim();
    const description = document.getElementById('f-item-desc').value.trim();
    const value = parseFloat(document.getElementById('f-item-value').value) || 0;
    const quantity = Math.max(1, parseInt(document.getElementById('f-item-qty').value) || 1);
    if(!name){ toast('Digite o nome da peça', ICONS.alertTriangle); return; }
    const id = t.dataset.id;
    if(id){
      const it = items.find(i=>i.id===id);
      it.name = name; it.description = description; it.value = value; it.quantity = quantity; it.image = pendingImageData;
      toast('Peça atualizada');
    } else {
      items.push({
        id: uid('item'),
        categoryId: t.dataset.cat,
        originCategoryId: t.dataset.cat,
        name, description, value, quantity,
        image: pendingImageData,
        status: 'in_category',
        delivery: null,
        visibleToClient: false,
        clientImage: null,
        tagTrending: false,
        tagFeatured: false,
        tagLowStock: false
      });
      toast('Peça adicionada');
    }
    await saveItems();
    closeModal(); render();
  }

  else if(action === 'delete-item'){
    confirmContext = { type:'delete-item', id: t.dataset.id };
    modalConfirm({ title:'Excluir peça?', message:'Esta ação não pode ser desfeita.', confirmLabel:'Excluir', onConfirmAction:'do-delete-item', danger:true });
  }
  else if(action === 'do-delete-item'){
    items = items.filter(i=>i.id!==confirmContext.id);
    await saveItems();
    toast('Peça excluída');
    closeModal(); render();
  }

  else if(action === 'forward-item'){
    const it = items.find(i=>i.id===t.dataset.id);
    closeModal();
    setTimeout(()=> modalDeliveryForm(it), 120);
  }

  else if(action === 'confirm-forward'){
    const address = document.getElementById('f-d-address').value.trim();
    const date = document.getElementById('f-d-date').value;
    const receiverName = document.getElementById('f-d-name').value.trim();
    if(!address || !date || !receiverName){ toast('Preencha todos os campos', ICONS.alertTriangle); return; }
    const it = items.find(i=>i.id===t.dataset.id);
    const totalQty = it.quantity ?? 1;
    const qtyEl = document.getElementById('f-d-qty');
    let forwardQty = qtyEl ? (parseInt(qtyEl.value) || 1) : 1;
    forwardQty = Math.min(Math.max(forwardQty, 1), totalQty);

    const deliveryInfo = { address, date, receiverName, forwardedAt: Date.now() };

    if(forwardQty >= totalQty){
      // encaminha a peça inteira
      it.status = 'to_deliver';
      it.originCategoryId = it.categoryId;
      it.quantity = totalQty;
      it.delivery = deliveryInfo;
    } else {
      // encaminha só parte da quantidade: a peça original fica na categoria com o restante,
      // e uma nova entrada é criada para a parte que vai para entrega
      it.quantity = totalQty - forwardQty;
      items.push({
        id: uid('item'),
        categoryId: it.categoryId,
        originCategoryId: it.categoryId,
        name: it.name,
        description: it.description,
        value: it.value,
        quantity: forwardQty,
        image: it.image,
        status: 'to_deliver',
        delivery: deliveryInfo
      });
    }
    await saveItems();
    toast('Peça encaminhada para entrega');
    closeModal();
    setView('entregas');
  }

  else if(action === 'finish-delivery'){
    confirmContext = { type:'finish', id: t.dataset.id };
    modalConfirm({ title:'Finalizar entrega?', message:'Deseja realmente finalizar esta entrega?', confirmLabel:'Finalizar entrega', onConfirmAction:'do-finish-delivery' });
  }
  else if(action === 'do-finish-delivery'){
    const it = items.find(i=>i.id===confirmContext.id);
    it.status = 'delivered';
    it.finishedAt = Date.now();
    await saveItems();
    toast('Entrega finalizada');
    closeModal(); render();
  }

  else if(action === 'sales-filter'){
    salesFilterMode = t.dataset.mode;
    salesFilterDay = null;
    render();
  }

  else if(action === 'set-theme'){
    appSettings.theme = t.dataset.theme;
    applyTheme();
    await saveSettings();
    render();
  }

  else if(action === 'set-store-mode'){
    appSettings.storeMode = t.dataset.mode;
    await saveSettings();
    render();
    toast('Modo da loja atualizado');
  }

  else if(action === 'do-logout'){
    confirmContext = { type:'logout' };
    modalConfirm({ title:'Sair deste painel?', message:'Você precisará digitar a senha de administrador novamente para voltar a acessar.', confirmLabel:'Sair', onConfirmAction:'confirm-logout' });
  }
  else if(action === 'confirm-logout'){
    closeModal();
    logoutAdmin();
  }

  else if(action === 'reset-all'){
    confirmContext = { type:'reset' };
    modalConfirm({ title:'Limpar todos os dados?', message:'Todas as categorias e peças serão apagadas permanentemente.', confirmLabel:'Limpar tudo', onConfirmAction:'do-reset-all', danger:true });
  }
  else if(action === 'do-reset-all'){
    categories = [{ id: DEFAULT_CATEGORY_ID, name: 'Vendas para Entregar', createdAt: Date.now() }];
    items = [];
    await saveCategories(); await saveItems();
    toast('Dados reiniciados');
    closeModal(); setView('inicio');
  }
});

document.addEventListener('change', async (e)=>{
  const cv = e.target.closest('[data-client-visible]');
  if(cv){
    const it = items.find(i=>i.id===cv.dataset.clientVisible);
    if(!it) return;
    it.visibleToClient = cv.checked;
    try{ await saveItems(); }catch(err){ return; }
    toast(cv.checked ? 'Peça agora aparece na loja' : 'Peça removida da loja');
    render();
    return;
  }

  const choice = e.target.closest('[data-client-img-choice]');
  if(choice){
    const it = items.find(i=>i.id===choice.dataset.clientImgChoice);
    if(!it) return;
    if(choice.value === 'existing' && it.clientImage){
      it.clientImage = null;
      try{ await saveItems(); }catch(err){ return; }
      toast('Usando a foto normal da peça');
    }
    render();
    return;
  }

  const tagInput = e.target.closest('[data-tag]');
  if(tagInput){
    const it = items.find(i=>i.id===tagInput.dataset.tagId);
    if(!it) return;
    const field = { trending:'tagTrending', featured:'tagFeatured', lowStock:'tagLowStock' }[tagInput.dataset.tag];
    if(!field) return;
    it[field] = tagInput.checked;
    try{ await saveItems(); }catch(err){ return; }
    render();
    return;
  }

  const fileInput = e.target.closest('[data-client-img-file]');
  if(fileInput){
    const it = items.find(i=>i.id===fileInput.dataset.clientImgFile);
    if(!it) return;
    const file = fileInput.files[0];
    if(!file) return;
    const dataUrl = await processImageFile(file);
    it.clientImage = dataUrl;
    try{ await saveItems(); }catch(err){ return; }
    toast('Foto do cliente atualizada');
    render();
  }
});

/* =========================================================
   PORTÃO DE ACESSO — login de administrador (JR IMPORTADOS)
   Senha única verificada no servidor (variável ADMIN_PASSWORD).
   ========================================================= */
function renderGate(html){
  document.getElementById('gate-root').style.display = 'block';
  document.getElementById('gate-root').innerHTML = html;
}
function hideGate(){
  document.getElementById('gate-root').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}

function renderLoginGate(errorMsg){
  renderGate(`
    <div class="gate-wrap"><div class="gate-card">
      <div class="gate-mark">JR</div>
      <h1>Acesso restrito</h1>
      <p class="gate-sub">Painel exclusivo dos administradores da JR IMPORTADOS. Digite a senha para continuar.</p>
      <input type="password" id="gate-password-input" placeholder="Senha de administrador" autocomplete="current-password">
      <p class="gate-error" id="gate-password-error">${errorMsg ? escapeHtml(errorMsg) : ''}</p>
      <button class="btn btn-primary btn-block" id="gate-password-continue" style="margin-top:10px;">Entrar</button>
    </div></div>
  `);
  const input = document.getElementById('gate-password-input');
  input.focus();
  const go = async ()=>{
    const val = input.value;
    const errEl = document.getElementById('gate-password-error');
    if(!val){ errEl.textContent = 'Digite a senha.'; return; }
    const btn = document.getElementById('gate-password-continue');
    btn.disabled = true; btn.textContent = 'Entrando...';
    try{
      const r = await fetch(API_BASE + '/api/admin/login', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ password: val })
      });
      const data = await r.json().catch(()=>({}));
      if(!r.ok || !data.token){
        errEl.textContent = data.error || 'Senha incorreta.';
        btn.disabled = false; btn.textContent = 'Entrar';
        return;
      }
      adminToken = data.token;
      localStorage.setItem('adminToken', adminToken);
      await grantAccess();
    }catch(e){
      errEl.textContent = 'Não foi possível conectar ao servidor.';
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  };
  document.getElementById('gate-password-continue').addEventListener('click', go);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') go(); });
}

async function grantAccess(){
  hideGate();
  await loadSettings();
  await loadData();
  render();
  toast('Acesso liberado. Bem-vindo(a), administrador(a).');
}

function logoutAdmin(){
  adminToken = '';
  localStorage.removeItem('adminToken');
  document.getElementById('app').style.display = 'none';
  renderLoginGate();
}

async function initGate(){
  if(adminToken){
    try{
      await loadSettings();
      await loadData();
      hideGate();
      render();
      updateInstallButton();
      return;
    }catch(e){
      // token inválido/expirado: cai para a tela de login abaixo
    }
  }
  renderLoginGate();
}

  updateInstallButton();
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  updateInstallButton();
  toast('JR IMPORTADOS instalado como aplicativo');
});

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function updateInstallButton(){
  const btn = document.getElementById('install-app-btn');
  const hint = document.getElementById('install-app-hint');
  if(!btn) return;

  if(isStandalone()){
    btn.disabled = true;
    btn.textContent = '✓ JR IMPORTADOS já está instalado';
    if(hint) hint.textContent = 'O painel JR IMPORTADOS já está aberto como aplicativo.';
    return;
  }

  btn.disabled = false;
  btn.textContent = '📲 Instalar aplicativo';

  if(hint){
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if(ios){
      hint.textContent = 'No iPhone/iPad: toque em Compartilhar no Safari e escolha “Adicionar à Tela de Início”.';
    } else if(!deferredInstallPrompt){
      hint.textContent = 'Se o navegador não mostrar a instalação agora, procure “Instalar JR IMPORTADOS” no menu do navegador.';
    } else {
      hint.textContent = 'Instalação disponível neste dispositivo.';
    }
  }
}

async function installApp(){
  if(isStandalone()) return;

  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const result = await deferredInstallPrompt.userChoice;
    if(result.outcome === 'accepted') toast('Instalação iniciada');
    deferredInstallPrompt = null;
    updateInstallButton();
    return;
  }

  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if(ios){
    openModal(`
      <div class="modal-head"><h2>Instalar no iPhone</h2>
        <button class="modal-close" data-action="close-modal">${ICONS.x}</button></div>
      <div class="modal-body">
        <p class="desc" style="line-height:1.7;">No Safari, toque em <strong>Compartilhar</strong> e depois em <strong>Adicionar à Tela de Início</strong>. Assim o painel ficará com o ícone na sua tela inicial.</p>
      </div>
      <div class="modal-foot">
        <button class="btn btn-primary btn-block" data-action="close-modal">Entendi</button>
      </div>
    `);
  } else {
    toast('A instalação ainda não está disponível neste navegador. Abra pelo Chrome ou Edge e tente novamente.');
  }
}

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
(async function init(){
  await initGate();
})();
</script>
