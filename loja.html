<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#F7F5F0">
<title>JR IMPORTADOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#C9A24B;
    --gold-deep:#A9812F;
    --gold-light:#EFDFB6;
    --silver:#C6C6C6;
    --silver-light:#EDEDED;
    --white:#FFFFFF;
    --bg:#FBF9F5;
    --ink:#242220;
    --ink-soft:#8A8578;
    --border:#E7E1D3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Bodoni Moda', Georgia, serif;}
  ::selection{background:var(--gold-light); color:var(--ink);}
  img{max-width:100%;}

  header{
    position:sticky; top:0; z-index:20;
    background:rgba(251,249,245,0.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:20px 28px;
    display:flex; align-items:center; justify-content:center;
  }
  .brand{text-align:center;}
  .brand .name{font-size:26px; font-weight:600; letter-spacing:3px; color:var(--ink); background:linear-gradient(120deg,var(--gold-deep),var(--gold),var(--silver)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .brand .tag{font-size:10.5px; letter-spacing:3px; color:var(--gold-deep); text-transform:uppercase; margin-top:2px;}

  main{max-width:1180px; margin:0 auto; padding:36px 24px 90px;}

  .hero{text-align:center; padding:26px 10px 40px;}
  .hero h1{font-size:34px; font-weight:600; margin:0 0 10px; letter-spacing:.4px;}
  .hero p{color:var(--ink-soft); font-size:14.5px; margin:0; letter-spacing:.2px;}

  /* ---------- Faixa animada (modo "animado") ---------- */
  .marquee-wrap{
    overflow:hidden; margin:0 0 44px; padding:18px 0; position:relative;
    background:linear-gradient(90deg, var(--white), var(--gold-light) 50%, var(--white));
    border-top:1px solid var(--border); border-bottom:1px solid var(--border);
  }
  .marquee-wrap::before, .marquee-wrap::after{
    content:''; position:absolute; top:0; bottom:0; width:60px; z-index:2;
  }
  .marquee-wrap::before{left:0; background:linear-gradient(90deg,var(--bg),transparent);}
  .marquee-wrap::after{right:0; background:linear-gradient(270deg,var(--bg),transparent);}
  .marquee-track{display:flex; gap:20px; width:max-content; animation:marquee 34s linear infinite;}
  .marquee-wrap:hover .marquee-track{animation-play-state:paused;}
  @keyframes marquee{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
  .m-card{
    width:150px; flex:none; border-radius:10px; overflow:hidden; background:var(--white);
    border:1px solid var(--border); box-shadow:0 6px 18px rgba(169,129,47,0.10);
  }
  .m-card .m-thumb{width:100%; aspect-ratio:4/5; overflow:hidden; background:var(--silver-light);}
  .m-card .m-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .m-card .m-name{font-size:12px; font-weight:600; padding:8px 10px 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .m-card .m-price{font-size:12px; color:var(--gold-deep); padding:0 10px 10px; font-weight:700;}

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:22px;
  }
  .card{
    background:var(--white); border:1px solid var(--border); border-radius:8px;
    overflow:hidden; position:relative;
  }
  /* modo animado: cards entram com fade+slide em onda (stagger) e imagem dá zoom + leve inclinação 3D no hover */
  .mode-animado .card{
    opacity:0; transform:translateY(26px) scale(.98);
    transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1), box-shadow .25s ease;
    will-change:transform;
  }
  .mode-animado .card.in{opacity:1; transform:translateY(0) scale(1);}
  .mode-animado .card.in:hover{transition:transform .12s ease, box-shadow .25s ease;}
  .mode-animado .card:hover{box-shadow:0 18px 38px rgba(169,129,47,0.22); border-color:var(--gold);}
  .mode-animado .thumb{position:relative;}
  .mode-animado .thumb img{transition:transform .6s cubic-bezier(.16,1,.3,1);}
  .mode-animado .card:hover .thumb img{transform:scale(1.1);}
  .mode-animado .thumb::after{
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.35) 50%, transparent 60%);
    transform:translateX(-120%); transition:transform .7s ease;
  }
  .mode-animado .card:hover .thumb::after{transform:translateX(120%);}

  /* modo minimalista: só a peça aumenta ao passar o mouse, sem mais nada */
  .mode-minimalista .card{border-color:var(--border);}
  .mode-minimalista .thumb img{transition:transform .35s ease;}
  .mode-minimalista .card:hover .thumb img{transform:scale(1.18);}
  .mode-minimalista .card{box-shadow:none;}

  /* modo padrão: sem efeitos, vitrine simples */
  .mode-padrao .card{transition:none;}
  .mode-padrao .thumb img{transition:none;}

  .thumb{width:100%; aspect-ratio:4/5; overflow:hidden; background:var(--silver-light); display:flex; align-items:center; justify-content:center; position:relative;}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb .placeholder{color:var(--ink-soft); font-size:12px; letter-spacing:1px;}

  .badges{position:absolute; top:10px; left:10px; display:flex; flex-direction:column; gap:6px; z-index:2;}
  .badge-tag{
    font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:100px; letter-spacing:.3px;
    backdrop-filter:blur(4px);
  }
  .badge-trending{background:rgba(201,162,75,0.92); color:#fff;}
  .badge-featured{background:rgba(36,34,32,0.85); color:var(--gold-light);}
  .badge-lowstock{background:rgba(196,64,64,0.9); color:#fff;}

  .card-body{padding:16px 16px 18px;}
  .card-body .cat{font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--gold-deep); margin:0 0 6px;}
  .card-body .name{font-size:18px; font-weight:600; margin:0 0 6px; line-height:1.25;}
  .card-body .desc{font-size:12.5px; color:var(--ink-soft); line-height:1.55; margin:0 0 12px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card-body .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .price{font-family:'Bodoni Moda',serif; font-size:20px; color:var(--ink);}
  .whats-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:linear-gradient(120deg,var(--gold-deep),var(--gold)); color:#fff; font-weight:700; font-size:12.5px;
    padding:9px 14px; border-radius:100px; text-decoration:none; white-space:nowrap; border:none;
    transition:filter .15s ease, transform .1s ease;
  }
  .whats-btn:hover{filter:brightness(1.08);}
  .whats-btn:active{transform:scale(0.97);}

  .cat-filters{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:34px;}
  .cat-chip{
    padding:8px 16px; border-radius:100px; border:1px solid var(--border);
    font-size:12.5px; letter-spacing:.5px; color:var(--ink-soft); cursor:pointer;
    background:var(--white); transition:all .15s ease;
  }
  .cat-chip:hover{border-color:var(--gold); color:var(--ink);}
  .cat-chip.active{background:linear-gradient(120deg,var(--gold-deep),var(--gold)); color:#fff; border-color:var(--gold); font-weight:600;}

  .empty, .loading{ text-align:center; padding:90px 20px; color:var(--ink-soft); }
  .empty h2, .loading p{font-size:18px; color:var(--ink); margin:0 0 8px;}
  .empty p{font-size:13.5px; margin:0;}

  footer{
    border-top:1px solid var(--border); padding:28px 24px; text-align:center;
    color:var(--ink-soft); font-size:11.5px; letter-spacing:1px;
  }

  @media (max-width:560px){
    .brand .name{font-size:21px; letter-spacing:2px;}
    .hero h1{font-size:26px;}
    .m-card{width:120px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="name">JR IMPORTADOS</div>
    <div class="tag">Peças selecionadas</div>
  </div>
</header>

<main>
  <div class="hero">
    <h1>Nossa vitrine</h1>
    <p>Confira as peças disponíveis e fale com a gente pelo WhatsApp.</p>
  </div>

  <div id="marquee-slot"></div>
  <div id="filters"></div>
  <div id="content" class="loading"><p>Carregando peças...</p></div>
</main>

<footer>JR IMPORTADOS</footer>

<script>
  const WHATS_NUMBER = ''; // preencha com o número no formato 5599999999999 (com DDI e DDD)
  let allItems = [];
  let allCategories = [];
  let storeMode = 'animado';
  let activeCat = 'todas';

  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function fmtMoney(v){
    const n = Number(v) || 0;
    return n.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  }

  async function load(){
    try{
      const r = await fetch('/api/store');
      const data = await r.json();
      allItems = Array.isArray(data.items) ? data.items : [];
      allCategories = Array.isArray(data.categories) ? data.categories : [];
      storeMode = ['padrao','animado','minimalista'].includes(data.storeMode) ? data.storeMode : 'animado';
      document.body.className = 'mode-' + storeMode;
      render();
    }catch(e){
      document.getElementById('content').innerHTML = `
        <div class="empty"><h2>Não foi possível carregar a loja</h2><p>Tente novamente em instantes.</p></div>`;
    }
  }

  function renderMarquee(){
    const slot = document.getElementById('marquee-slot');
    if(storeMode !== 'animado'){ slot.innerHTML = ''; return; }
    let picks = allItems.filter(it => it.trending || it.featured);
    if(picks.length < 4) picks = allItems.slice(0, 10);
    if(picks.length === 0){ slot.innerHTML = ''; return; }
    const doubled = picks.concat(picks);
    slot.innerHTML = `
      <div class="marquee-wrap">
        <div class="marquee-track">
          ${doubled.map(it => `
            <div class="m-card">
              <div class="m-thumb">${it.image ? `<img src="${it.image}" alt="${escapeHtml(it.name)}">` : ''}</div>
              <div class="m-name">${escapeHtml(it.name)}</div>
              <div class="m-price">${fmtMoney(it.value)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function renderFilters(){
    const el = document.getElementById('filters');
    if(allCategories.length <= 1){ el.innerHTML = ''; return; }
    const chips = [`<button class="cat-chip ${activeCat==='todas'?'active':''}" data-cat="todas">Todas</button>`]
      .concat(allCategories.map(c => `<button class="cat-chip ${activeCat===c.id?'active':''}" data-cat="${c.id}">${escapeHtml(c.name)}</button>`));
    el.innerHTML = `<div class="cat-filters">${chips.join('')}</div>`;
    el.querySelectorAll('[data-cat]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ activeCat = btn.dataset.cat; render(); });
    });
  }

  function badgesFor(it){
    const b = [];
    if(it.trending) b.push(`<span class="badge-tag badge-trending">🔥 Em alta</span>`);
    if(it.featured) b.push(`<span class="badge-tag badge-featured">⭐ Destaque</span>`);
    if(it.lowStock) b.push(`<span class="badge-tag badge-lowstock">⚠️ Últimas peças</span>`);
    return b.length ? `<div class="badges">${b.join('')}</div>` : '';
  }

  function render(){
    renderMarquee();
    renderFilters();
    const list = activeCat === 'todas' ? allItems : allItems.filter(it => it.categoryId === activeCat);
    const content = document.getElementById('content');
    if(list.length === 0){
      content.className = '';
      content.innerHTML = `<div class="empty"><h2>Nenhuma peça disponível no momento</h2><p>Volte em breve para novidades.</p></div>`;
      return;
    }
    content.className = '';
    content.innerHTML = `<div class="grid">${list.map((it,i) => `
      <div class="card" data-id="${it.id}" ${storeMode==='animado' ? `style="transition-delay:${(i%10)*60}ms"` : ''}>
        <div class="thumb">
          ${badgesFor(it)}
          ${it.image ? `<img src="${it.image}" alt="${escapeHtml(it.name)}">` : `<span class="placeholder">Sem foto</span>`}
        </div>
        <div class="card-body">
          <p class="cat">${escapeHtml(categoryName(it.categoryId))}</p>
          <p class="name">${escapeHtml(it.name)}</p>
          ${storeMode !== 'minimalista' && it.description ? `<p class="desc">${escapeHtml(it.description)}</p>` : ''}
          <div class="row">
            <span class="price">${fmtMoney(it.value)}</span>
            <a class="whats-btn" target="_blank" rel="noopener" href="${whatsLink(it)}">WhatsApp</a>
          </div>
        </div>
      </div>
    `).join('')}</div>`;

    if(storeMode === 'animado'){
      requestAnimationFrame(()=>{
        const cards = content.querySelectorAll('.card');
        const io = new IntersectionObserver(entries=>{
          entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
        }, { threshold:0.1 });
        cards.forEach(c=>{
          io.observe(c);
          attachTilt(c);
        });
      });
    } else {
      content.querySelectorAll('.card').forEach(c=> c.classList.add('in'));
    }
  }

  /* Leve inclinação 3D seguindo o cursor — só no modo Animado, e só em telas com mouse */
  const hasHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  function attachTilt(card){
    if(!hasHover) return;
    const maxTilt = 6;
    card.addEventListener('mousemove', (e)=>{
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      const rotY = (px - 0.5) * maxTilt * 2;
      const rotX = (0.5 - py) * maxTilt * 2;
      card.style.transform = `translateY(0) scale(1.015) perspective(700px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    });
    card.addEventListener('mouseleave', ()=>{
      card.style.transform = '';
    });
  }

  function categoryName(catId){
    return allCategories.find(c=>c.id===catId)?.name || 'Peça';
  }

  function whatsLink(it){
    const msg = encodeURIComponent(`Olá! Tenho interesse na peça "${it.name}" (${fmtMoney(it.value)}) da JR IMPORTADOS.`);
    return WHATS_NUMBER ? `https://wa.me/${WHATS_NUMBER}?text=${msg}` : `https://wa.me/?text=${msg}`;
  }

  load();
</script>
</body>
</html>
